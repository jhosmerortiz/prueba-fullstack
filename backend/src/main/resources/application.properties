
# Nombre del proyecto
spring.application.name=vertex-catalogo

# Puerto del backend
server.port=${PORT:8080}

# Conexion con Supabase PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=3


spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_PROJECT_URL}/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_PROJECT_URL}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

